name: Preview proximo post (quintas)

# Quinta-feira 09:07 BRT = quinta 12:07 UTC — fora do minuto cheio pra evitar skip por carga do GH Actions
on:
  schedule:
    - cron: '7 12 * * 4'
  workflow_dispatch:
    inputs:
      pub_id:
        description: 'pub-id especifico (vazio = proximo agendado)'
        required: false
        default: ''

permissions:
  contents: write   # pra commitar o marker .preview-sent

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar deps
        run: pip install requests pillow matplotlib

      - name: Determinar pub_id
        id: pubid
        run: |
          if [ -n "${{ github.event.inputs.pub_id }}" ]; then
            echo "pub_id=${{ github.event.inputs.pub_id }}" >> "$GITHUB_OUTPUT"
            echo "Forcando pub: ${{ github.event.inputs.pub_id }}"
          else
            PUB_ID=$(python <<'PY'
          import json, datetime, glob, sys
          today = datetime.date.today()
          best = None
          for f in sorted(glob.glob("publications/pub-*/metadata.json")):
              m = json.load(open(f, encoding="utf-8"))
              if m.get("post_zero"):
                  continue
              dp = m.get("data_post")
              if not dp:
                  continue
              try:
                  d = datetime.date.fromisoformat(dp)
              except Exception:
                  continue
              if d >= today and (best is None or d < best[0]):
                  best = (d, m["id"])
          if best:
              print(best[1])
          PY
          )
            echo "pub_id=$PUB_ID" >> "$GITHUB_OUTPUT"
            echo "Proximo agendado: $PUB_ID"
          fi

      - name: Sair se nao ha pub
        if: steps.pubid.outputs.pub_id == ''
        run: |
          echo "Sem pub agendada — encerrando."
          exit 0

      - name: Idempotencia — pular se preview ja enviado para esse pub
        id: idem
        if: steps.pubid.outputs.pub_id != ''
        run: |
          MARKER="publications/${{ steps.pubid.outputs.pub_id }}/.preview-sent"
          if [ -f "$MARKER" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Marker $MARKER existe — preview ja foi enviado pra essa pub. Encerrando sem reenviar."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Marker $MARKER nao existe — vai gerar e enviar."
          fi

      - name: Gerar PDF preview
        if: steps.pubid.outputs.pub_id != '' && steps.idem.outputs.skip == 'false'
        run: |
          python scripts/preview_proximo_post.py --pub "${{ steps.pubid.outputs.pub_id }}" --out preview.pdf
          ls -la preview.pdf

      - name: Enviar email com PDF
        if: steps.pubid.outputs.pub_id != '' && steps.idem.outputs.skip == 'false'
        env:
          GMAIL_CLIENT_ID:     ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          MAIL_FROM:           ${{ secrets.MAIL_FROM }}
        run: |
          PUB="${{ steps.pubid.outputs.pub_id }}"
          DATA=$(python -c "import json; print(json.load(open(f'publications/{\"$PUB\"}/metadata.json', encoding='utf-8'))['data_post'])")
          TITULO=$(python -c "import json; print(json.load(open(f'publications/{\"$PUB\"}/metadata.json', encoding='utf-8'))['titulo'])")
          BODY=$'Preview do próximo post do Data Folia agendado para '"$DATA"$'.\n\nPub: '"$PUB"$'\nTítulo: '"$TITULO"$'\n\nEsse PDF foi gerado automaticamente toda quinta-feira pela cron.\nSite: https://datafolia.com.br/  ·  Instagram: https://www.instagram.com/datafolia/'
          python scripts/send_preview_email.py \
            --pdf preview.pdf \
            --subject "Data Folia · preview do post de $DATA · $TITULO" \
            --body "$BODY"

      - name: Marcar preview enviado (commitar .preview-sent)
        if: success() && steps.pubid.outputs.pub_id != '' && steps.idem.outputs.skip == 'false'
        run: |
          PUB="${{ steps.pubid.outputs.pub_id }}"
          MARKER="publications/$PUB/.preview-sent"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > "$MARKER"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MARKER"
          git commit -m "chore: marca preview-sent para $PUB"
          n=0
          until git push origin HEAD:main; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then echo "push falhou apos 3 tentativas"; exit 1; fi
            echo "push falhou (tentativa $n/3) — rebase e retry em 20s"
            sleep 20
            git pull --rebase origin main || true
          done

      - name: Notificar (ntfy)
        if: always() && steps.pubid.outputs.pub_id != ''
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            curl -sS \
              -H "Title: Data Folia: preview enviado" \
              -H "Tags: envelope" \
              -H "Priority: default" \
              -d "Preview do post ${{ steps.pubid.outputs.pub_id }} enviado para Vini + Giovana." \
              https://ntfy.sh/vinicius-claude-alert
          else
            MSG=$'Falhou o envio do preview da pub '"${{ steps.pubid.outputs.pub_id }}"$'.\n\nLogs: https://github.com/calculadoraestatistica/datafolia/actions/runs/'"${{ github.run_id }}"
            curl -sS \
              -H "Title: Data Folia: FALHA no preview de quinta" \
              -H "Tags: rotating_light,warning" \
              -H "Priority: urgent" \
              -H "Email: v178334@dac.unicamp.br" \
              -H "Click: https://github.com/calculadoraestatistica/datafolia/actions/runs/${{ github.run_id }}" \
              -d "$MSG" \
              https://ntfy.sh/vinicius-claude-alert
          fi
