name: Post weekly to Instagram

# Toda segunda 22:07 UTC = 19:07 BRT — fora do minuto cheio pra evitar skip por carga do GH Actions
# E permite disparo manual pelo botao "Run workflow" na aba Actions
on:
  schedule:
    - cron: '7 22 * * 1'
  workflow_dispatch:
    inputs:
      pub_id:
        description: 'pub-id a postar (deixe em branco para usar o da data de hoje)'
        required: false
        default: ''

permissions:
  contents: write   # pra commitar/pushar os assets gerados

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar git
        run: |
          git config user.name "datafolia-bot"
          git config user.email "calculadoraestatistica@gmail.com"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar deps
        run: pip install requests pillow matplotlib

      - name: Determinar pub_id de hoje
        id: pubid
        run: |
          if [ -n "${{ github.event.inputs.pub_id }}" ]; then
            echo "pub_id=${{ github.event.inputs.pub_id }}" >> "$GITHUB_OUTPUT"
            echo "Usando pub_id manual: ${{ github.event.inputs.pub_id }}"
          else
            PUB_ID=$(python <<'PY'
          import json, datetime, glob, sys, os
          today = datetime.date.today().isoformat()
          for f in sorted(glob.glob("publications/pub-*/metadata.json")):
              m = json.load(open(f, encoding="utf-8"))
              if m.get("data_post") == today and not m.get("post_zero"):
                  print(m["id"])
                  sys.exit(0)
          PY
          )
            if [ -z "$PUB_ID" ]; then
              echo "Nenhuma pub agendada para hoje ($(date -I)) — nada a postar."
              echo "pub_id=" >> "$GITHUB_OUTPUT"
            else
              echo "pub_id=$PUB_ID" >> "$GITHUB_OUTPUT"
              echo "Pub de hoje: $PUB_ID"
            fi
          fi

      - name: Sair se nao ha pub
        if: steps.pubid.outputs.pub_id == ''
        run: |
          echo "Sem pub para hoje — encerrando sem erro."
          exit 0

      - name: Idempotencia — pular se essa pub ja foi postada
        id: idem
        if: steps.pubid.outputs.pub_id != ''
        run: |
          MARKER="publications/${{ steps.pubid.outputs.pub_id }}/.posted"
          if [ -f "$MARKER" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Marker $MARKER existe — pub ja postada. Encerrando sem repostar."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Gerar assets + push
        if: steps.pubid.outputs.pub_id != '' && steps.idem.outputs.skip == 'false'
        env:
          GITHUB_ACTIONS: "true"
        run: |
          python scripts/ig_post_test.py "${{ steps.pubid.outputs.pub_id }}" --generate-only

      - name: Aguardar GitHub Pages servir os assets (60s buffer)
        if: steps.pubid.outputs.pub_id != '' && steps.idem.outputs.skip == 'false'
        run: sleep 60

      - name: Postar no Instagram
        if: steps.pubid.outputs.pub_id != '' && steps.idem.outputs.skip == 'false'
        env:
          IG_TOKEN:    ${{ secrets.IG_TOKEN }}
          IG_USER_ID:  ${{ secrets.IG_USER_ID }}
        run: |
          python scripts/ig_post_test.py "${{ steps.pubid.outputs.pub_id }}" --post-only

      - name: Marcar pub como postada (.posted)
        # Cria o marker IMEDIATAMENTE apos Postar (mesmo se 1 story extra falhou):
        # o feed principal e ao menos 1 story ja sairam, evitando duplo post se
        # o workflow disparar de novo (cron + GH schedule + dispatch manual).
        if: always() && steps.pubid.outputs.pub_id != '' && steps.idem.outputs.skip == 'false'
        run: |
          PUB="${{ steps.pubid.outputs.pub_id }}"
          MARKER="publications/$PUB/.posted"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > "$MARKER"
          git add "$MARKER"
          # Commit happens in the next Rebuild step (same commit msg)

      - name: Rebuild site + commit .posted marker
        # always(): roda mesmo se um story adicional falhou — o feed principal
        # do Instagram já foi publicado nas etapas anteriores e queremos o
        # site sincronizado com o que o usuario verá no IG.
        if: always() && steps.pubid.outputs.pub_id != '' && steps.idem.outputs.skip == 'false'
        run: |
          python scripts/build_site.py
          PUB="${{ steps.pubid.outputs.pub_id }}"
          MARKER="publications/$PUB/.posted"
          git add index.html "$MARKER" 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nada novo pra commitar."
          else
            git commit -m "site: publica $PUB no index + marca .posted (cron)"
            n=0
            until git push; do
              n=$((n+1))
              if [ "$n" -ge 3 ]; then echo "push falhou apos 3 tentativas"; exit 1; fi
              echo "push falhou (tentativa $n/3) — rebase e retry em 20s"
              sleep 20
              git pull --rebase origin main || true
            done
          fi

      - name: Notificar sucesso (ntfy + email)
        if: success() && steps.pubid.outputs.pub_id != ''
        run: |
          MSG=$'Cron OK — postou '"${{ steps.pubid.outputs.pub_id }}"$' em @datafolia.\n\nVeja em https://www.instagram.com/datafolia/\nSite: https://datafolia.com.br/'
          curl -sS \
            -H "Title: Data Folia: post publicado" \
            -H "Tags: white_check_mark" \
            -H "Priority: low" \
            -H "Email: v178334@dac.unicamp.br" \
            -H "Click: https://www.instagram.com/datafolia/" \
            -d "$MSG" \
            https://ntfy.sh/vinicius-claude-alert

      - name: Notificar FALHA (ntfy + email)
        if: failure()
        run: |
          MSG=$'Cron post-weekly FALHOU.\n\nPub: '"${{ steps.pubid.outputs.pub_id }}"$'\nRun: https://github.com/calculadoraestatistica/datafolia/actions/runs/'"${{ github.run_id }}"$'\n\nAcoes possiveis:\n- Verificar logs do step que falhou no link acima.\n- Se for erro de token Meta: page token em uso e eterno; usuario token tem ~60d.\n- Se for erro de CDN/GH Pages: re-disparar workflow manualmente.'
          curl -sS \
            -H "Title: Data Folia: FALHA na cron" \
            -H "Tags: rotating_light,warning" \
            -H "Priority: urgent" \
            -H "Email: v178334@dac.unicamp.br" \
            -H "Click: https://github.com/calculadoraestatistica/datafolia/actions/runs/${{ github.run_id }}" \
            -d "$MSG" \
            https://ntfy.sh/vinicius-claude-alert
